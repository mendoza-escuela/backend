# Proxy del entorno efímero de seguridad.
#
# DECISIÓN DELIBERADA: este proxy es TRANSPARENTE. No agrega cabeceras de
# seguridad, no comprime y no cachea.
#
# Motivo: el objetivo del DAST es medir lo que entrega *la aplicación*
# (Helmet, CORS, el guard CSRF, el rate limiting de NestJS). Si el proxy de
# pruebas inyectara cabeceras, ZAP daría verde por mérito de esta configuración
# y no de la aplicación, ocultando exactamente lo que hay que auditar.
#
# El endurecimiento del reverse proxy de producción se valida por separado,
# contra el entorno de staging (ver docs/security/SECURITY_TESTING.md).

# No revelar la versión de nginx en las respuestas (ZAP 10036).
server_tokens off;

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Tamaño alineado con SURVEY_IMPORT_MAX_FILE_MB para no falsear los tests
    # de carga de archivos con un 413 del proxy.
    client_max_body_size 20m;

    # Sonda del healthcheck del contenedor: no pasa por los upstreams.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Las variables evitan que nginx resuelva los upstreams al arrancar, de modo
    # que el proxy funciona aunque el perfil `full` (SPA) no esté levantado.
    location /api/ {
        set $upstream_api http://sec-api:4000;
        proxy_pass $upstream_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las exportaciones y los PDF pueden tardar; el DAST no debe cortarlas.
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location / {
        set $upstream_web http://sec-web:8080;
        proxy_pass $upstream_web$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }
}
