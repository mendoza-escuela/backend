# Reglas de ZAP para el escaneo BASELINE y FULL.
#
# FORMATO: <id de regla><TAB><accion><TAB>(<comentario>)
# Acciones validas: PASS, IGNORE, INFO, WARN, FAIL
#
# CRITERIO: nada se pone en IGNORE para "poner el pipeline en verde". Solo se
# ignora lo demostrablemente inaplicable al entorno efimero, con su razon y el
# lugar donde SI se valida.

# --- BLOQUEANTES: no deben llegar a main ---
40012	FAIL	(XSS reflejado - React sin dangerouslySetInnerHTML: cualquier hallazgo es una regresion real)
40014	FAIL	(XSS persistente)
40018	FAIL	(Inyeccion SQL - auditada manualmente en la Fase 1, no debe aparecer nunca)
90019	FAIL	(Inyeccion de codigo en servidor)
90020	FAIL	(Inyeccion de comandos de sistema operativo)
40003	FAIL	(Inyeccion CRLF en cabeceras)
6	FAIL	(Navegacion de directorios)

# --- ADVERTENCIAS: se reportan y revisan, no bloquean ---
10038	WARN	(CSP ausente - Helmet la emite en /api; la de la SPA la aporta el proxy de produccion)
10063	WARN	(Permissions-Policy - se agrega en el reverse proxy de produccion)
10035	WARN	(HSTS - el entorno efimero es HTTP; se valida con testssl.sh contra staging)
10036	WARN	(Cabecera Server - se oculta en el proxy de produccion)
10021	WARN	(X-Content-Type-Options)
10020	WARN	(Anti-clickjacking)
10017	WARN	(Cross-domain JavaScript)
10098	WARN	(Cross-domain misconfiguration)
10054	WARN	(Cookie sin SameSite - se usa SameSite=None a proposito, ver hallazgo H-10)
10055	WARN	(CSP scanner)
10096	WARN	(Timestamp expuesto - /api/health devuelve timestamp a proposito)
10109	WARN	(Modern web application)
10015	WARN	(Cabeceras de cache)
10027	WARN	(Fuga de informacion en comentarios)
90022	WARN	(Application error disclosure)

# --- IGNORADAS: solo casos inaplicables, con justificacion ---
10011	IGNORE	(Cookie sin flag Secure sobre HTTP - el entorno de CI no tiene TLS por diseno. La cookie SI se emite con Secure (verificado en Fase 2) y el TLS real se audita con testssl.sh)
10049	IGNORE	(Contenido no cacheable - sin impacto en el modelo de amenazas de esta aplicacion)
