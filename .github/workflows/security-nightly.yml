name: Seguridad (nocturno)

# Escaneo profundo semanal programado.
#
# POR QUÉ EXISTE: una vulnerabilidad puede publicarse sin que cambie una sola
# línea del código. Un pipeline que sólo corre en cada PR no detecta un CVE
# aparecido después del último merge. Este workflow vuelve a analizar las mismas
# dependencias e imágenes una vez por semana.
#
# CRON: lunes 03:17 UTC = lunes 00:17 en Argentina (UTC-3). El minuto 17 evita el pico de
# runners que se produce en las horas y medias horas exactas.
# Para cambiar el horario, editar la expresión de abajo (siempre en UTC).

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'URL del frontend de staging (opcional)'
        type: string
        required: false
      staging_api_url:
        description: 'URL de la API de staging (opcional si comparte dominio)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: security-nightly
  cancel-in-progress: false

jobs:
  deep-scan:
    name: Escaneo profundo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout del frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mendoza-escuela/frontend
          ref: develop
          path: frontend-repo

      - name: Resolver el destino del DAST
        id: target
        env:
          # Prioridad: el input manual, después el secreto del repositorio.
          INPUT_URL: ${{ inputs.staging_url }}
          SECRET_URL: ${{ secrets.SECURITY_STAGING_URL }}
          INPUT_API_URL: ${{ inputs.staging_api_url }}
          SECRET_API_URL: ${{ secrets.SECURITY_STAGING_API_URL }}
        run: |
          url="${INPUT_URL:-$SECRET_URL}"
          api_url="${INPUT_API_URL:-$SECRET_API_URL}"
          if [ -z "$url" ]; then
            echo "staging=" >> "$GITHUB_OUTPUT"
            echo "staging_api=" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin staging configurado: el DAST activo y testssl.sh se ejecutan sólo contra el entorno efímero."
          else
            echo "staging=$url" >> "$GITHUB_OUTPUT"
            echo "staging_api=${api_url:-$url}" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend y API de staging configurados para DAST activo."
          fi

      - name: Suite completa con ZAP full scan
        env:
          SECURITY_FRONTEND_CONTEXT: ${{ github.workspace }}/frontend-repo
          # Si está vacío, run-dast.sh usa el entorno efímero local y marca
          # testssl.sh como SKIPPED en lugar de fallar.
          SECURITY_STAGING_URL: ${{ steps.target.outputs.staging }}
          SECURITY_STAGING_API_URL: ${{ steps.target.outputs.staging_api }}
          # Credenciales exclusivas del entorno de pruebas. GitHub enmascara
          # estos valores y run-dast.sh mantiene el token sólo en memoria.
          SECURITY_ADMIN_EMAIL: ${{ secrets.SECURITY_ADMIN_EMAIL }}
          SECURITY_ADMIN_PASSWORD: ${{ secrets.SECURITY_ADMIN_PASSWORD }}
        run: bash security/scripts/run-all.sh --full-dast

      - name: Subir SARIF a Code Scanning
        if: always() && hashFiles('security/reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: security/reports/semgrep.sarif
          category: semgrep-nightly

      - name: Publicar resumen
        if: always()
        run: cat security/reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informes completos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-nightly-${{ github.run_id }}
          path: |
            security/reports/*.json
            security/reports/*.sarif
            security/reports/*.html
            security/reports/*.md
          retention-days: 14

      - name: Limpiar el entorno
        if: always()
        run: docker compose -f compose.security.yml --profile full --profile seed --profile tests down -v

      - name: Avisar si el escaneo nocturno falla
        if: failure()
        env:
          # Se pasa por env en lugar de interpolar ${{ }} dentro del script:
          # interpolar en un `run:` permite inyección de comandos.
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## El escaneo nocturno de seguridad falló"
            echo ""
            echo "Puede deberse a una vulnerabilidad NUEVA publicada sin que"
            echo "cambiara el código, o a una excepción de seguridad vencida."
            echo ""
            echo "Revisá el artifact security-nightly-$RUN_ID."
          } >> "$GITHUB_STEP_SUMMARY"
